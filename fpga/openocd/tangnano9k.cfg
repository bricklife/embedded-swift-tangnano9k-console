# OpenOCD configuration for Hazard3 on Tang Nano 9K
#
# Connect an external JTAG adapter to PMOD0:
#   PMOD0 pin 1  (FPGA pin 28) = TCK
#   PMOD0 pin 2  (FPGA pin 26) = TDI
#   PMOD0 pin 3  (FPGA pin 39) = TDO
#   PMOD0 pin 4  (FPGA pin 37) = TMS
#   PMOD0 pin 5  (FPGA pin 27) = (spare)
#   PMOD0 GND                  = GND
#
# The config below targets an FT2232H-based adapter (e.g. FT2232H Mini Module)
# on Channel A. Adjust ftdi_vid_pid and ftdi_channel for your specific adapter.

adapter driver ftdi
adapter speed 4000

ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0000 0x000b

set _CHIPNAME hazard3
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0xdeadbeef
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME

gdb_report_data_abort enable
init
halt
