# OpenOCD configuration for Hazard3 on Tang Nano 9K
#
# Connect an FT232H-based adapter to PMOD0:
#   PMOD0 FPGA pin 28 = TCK  ←→  FT232H AD0 (D0)
#   PMOD0 FPGA pin 26 = TDI  ←→  FT232H AD1 (D1)
#   PMOD0 FPGA pin 39 = TDO  ←→  FT232H AD2 (D2)
#   PMOD0 FPGA pin 37 = TMS  ←→  FT232H AD3 (D3)
#   PMOD0 GND                ←→  FT232H GND
#
# Tested with Adafruit FT232H Breakout (PID 0x6014).
# For FT2232H-based adapters use tangnano9k-openocd.cfg instead.

adapter driver ftdi
adapter speed 4000

ftdi vid_pid 0x0403 0x6014

# layout_init <value> <direction>
#   direction: 0x000b = 0b00001011 -> AD0(TCK), AD1(TDI), AD3(TMS) are outputs
#   value:     0x0008 = 0b00001000 -> TMS starts high (TAP reset state)
ftdi layout_init 0x0008 0x000b

set _CHIPNAME hazard3
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0xdeadbeef
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME

gdb_report_data_abort enable
init
halt
